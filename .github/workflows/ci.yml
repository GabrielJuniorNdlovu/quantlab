name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest --cov=quantlab --cov-branch --cov-report=term-missing
      - name: Install virtual display for native chart checks
        if: matrix.python-version == '3.14'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Exercise the actual offline chart
        if: matrix.python-version == '3.14'
        env:
          QUANTLAB_GUI_TEST: '1'
        run: xvfb-run -a python -m pytest -q tests/test_chart.py tests/test_replay_gui.py
